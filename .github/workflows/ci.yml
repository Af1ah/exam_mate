name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reject leaked production server details
        run: node scripts/check-public-config.mjs
      - name: Verify migration graph integrity
        run: bunx prisma migration check --json
      - name: Reject unsafe migration operations
        run: node scripts/check-migration-safety.mjs
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
